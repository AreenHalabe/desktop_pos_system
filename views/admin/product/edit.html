<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halabi_Services.ps</title>

    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/product/add-edit-product.css" />

</head>

<body>
    <div id="loader" class="text-center mt-5 fs-5">جاري التحميل...</div>

    <div class="container py-4" id="pageContent" style="display:none;">
        <div class="row">
            <div class="col-12">

                <!-- العنوان -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-white py-3">
                        <div class="row align-items-center gy-2">
                            <div class="col-12 col-md-6 text-center text-md-start">
                                <h6 class="m-0 fs-5 fs-md-4 fw-normal ">
                                    تعديل المنتج
                                </h6>
                            </div>

                            <div class="col-12 col-md-6 text-center text-md-end">
                                <a class="fs-5 fs-md-4 text-decoration-none" id="backBtn">
                                    رجوع <i class="bi bi-arrow-left"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- الفورم -->
                <div class="card shadow">
                    <div class="card-body">

                        <form id="product_form" method="POST" enctype="multipart/form-data">

                            <!-- الاسم + الوصف -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-md-6">
                                    <label for="name" class="form-label fw-bold">إسم الصنف</label>
                                    <input type="text" class="form-control bg-light" id="name" name="name" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="category_id" class="form-label fw-bold">الفئة</label>
                                    <select class="form-select bg-light" id="category_id" name="category_id"
                                        required></select>
                                </div>
                            </div>

                            <!-- السعر + checkbox -->
                            <div class="row g-3 mb-3">


                                <div class="col-12 col-md-6">

                                    <div id="base_price_box">
                                        <label for="price" class="form-label fw-bold">السعر الأساسي</label>
                                        <input type="number" class="form-control bg-light" id="price" name="price"
                                            placeholder="السعر" required>
                                    </div>


                                    <div class="d-flex align-items-center mt-3">
                                        <input type="checkbox" id="has_variants" name="has_variants" value="1"
                                            style="cursor:pointer;">
                                        <label for="has_variants" class="form-label ms-2 mb-0 fw-bold"
                                            style="cursor:pointer;">
                                            هذا المنتج له أحجام وأسعار مختلفة
                                        </label>
                                    </div>


                                </div>


                                <div class="col-12 col-md-6">
                                    
                                        <label for="barcode" class="form-label fw-bold">الباركود</label>
                                        <input type="number" class="form-control bg-light" id="barcode" name="barcode"
                                            placeholder="باركود">
                                    
                                </div>



                            </div>


                            <!-- جدول الأحجام -->
                            <div id="variants_box">
                                <label class="form-label fw-bold">الأحجام والأسعار</label>

                                <div class="table-responsive">
                                    <table class="table table-bordered text-center align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>الحجم</th>
                                                <th>السعر</th>
                                                <th>حذف</th>
                                            </tr>
                                        </thead>
                                        <tbody id="variants_table"></tbody>
                                    </table>
                                </div>

                                <button type="button" class="btn btn-success mb-3 col-12 col-sm-6 col-md-4 col-lg-2"
                                    id="add_variant_btn">
                                    <i class="bi bi-plus-square"></i> إضافة حجم
                                </button>
                            </div>

                            <!-- زر الحفظ -->
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary col-12 col-sm-6 col-md-4 col-lg-3 mt-4">
                                    <i class="bi bi-floppy"></i> حفظ التعديلات
                                </button>
                            </div>

                            <input type="text" id="old-image" name="old-image" hidden>
                        </form>

                        <div id="error_list" class="alert alert-danger p-2 mt-3 hidden">
                            <ul id="errors" class="mb-0 ps-3 text-danger"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>






    <div id="overlay_loader" style="
                display:none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.55);
                backdrop-filter: blur(3px);
                z-index: 9999;
                justify-content: center;
                align-items: center;
            ">
        <div class="text-center text-white">
            <div class="spinner-border" role="status" style="width: 4rem; height: 4rem;">
            </div>
            <p class="mt-3 fs-5">جاري معالجة الطلب، يرجى الانتظار...</p>
        </div>
    </div>
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/admin/product/edit.js"></script>
</body>

</html>
