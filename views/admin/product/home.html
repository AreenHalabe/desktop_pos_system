<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halabi_Technology.ps</title>

  <!-- Bootstrap RTL -->
  <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">



  <link rel="stylesheet" href="../../../public/style/admin/product/home.css" />
  <link rel="stylesheet" href="../../../public/style/admin/header.css" />


</head>

<body id="content">

  <site-header></site-header>

    <main class="items-page container-fluid">

      <!-- عنوان الصفحة والأزرار -->
      <section class="items-toolbar">

        <div class="items-page-heading">
          <div class="items-heading-icon">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>

          <div>
            <h1>إدارة الأصناف</h1>
            <p>عرض الأصناف والبحث عنها وإدارتها</p>
          </div>
        </div>

        <button type="button" class="btn btn-primary add-item-btn" id="addItemBtn">
          <i class="fa-solid fa-plus"></i>
          <span>إضافة صنف جديد</span>
        </button>

      </section>

      <!-- الفلاتر والبحث -->
      <section class="items-filter-card">

        <div class="filter-section-heading">
          <i class="fa-solid fa-sliders"></i>
          <span>البحث والفلترة</span>
        </div>

        <div class="row g-3 align-items-end">

          <!-- فلترة حسب الفئة -->
          <div class="col-12 col-md-5 col-lg-4">

            <label for="categoryFilter" class="form-label">
              الفئة
            </label>

            <div class="input-with-icon">
              <i class="fa-solid fa-layer-group"></i>

              <select class="form-select" id="categoryFilter">
                <option value="">كل الفئات</option>
              </select>
            </div>

          </div>

          <!-- البحث حسب الباركود -->
          <div class="col-12 col-md-7 col-lg-8">

            <label for="barcodeSearch" class="form-label">
              البحث حسب الباركود
            </label>

            <div class="barcode-search-group">

              <div class="input-with-icon barcode-input-wrapper">
                <i class="fa-solid fa-barcode"></i>

                <input type="search" class="form-control" id="barcodeSearch" placeholder="امسح الباركود أو أدخله هنا..."
                  autocomplete="off" inputmode="text">
              </div>

              <button type="button" class="btn btn-primary search-btn" id="searchBarcodeBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>بحث</span>
              </button>

              <button type="button" class="btn btn-light clear-search-btn" id="clearSearchBtn" title="مسح البحث"
                aria-label="مسح البحث">
                <i class="fa-solid fa-xmark"></i>
              </button>

            </div>

          </div>

        </div>

        <div class="filter-bottom-row">
          <div class="active-filter-info" id="activeFilterInfo">
            <i class="fa-solid fa-circle-info"></i>
            <span>يتم عرض جميع الأصناف</span>
          </div>

          <button type="button" class="btn btn-link reset-filters-btn" id="resetFiltersBtn">
            <i class="fa-solid fa-rotate-right"></i>
            إعادة ضبط الفلاتر
          </button>
        </div>

      </section>

      <!-- جدول الأصناف -->
      <section class="items-table-card">

        <div class="table-card-header">

          <div>
            <h2>قائمة الأصناف</h2>
            <p>إدارة الأصناف المسجلة في النظام</p>
          </div>

          <div class="items-count" id="itemsCount">
            <i class="fa-solid fa-box"></i>
            <span>0 صنف</span>
          </div>

        </div>

        <!-- رسائل الحالة -->
        <div class="items-alert alert d-none" id="itemsAlert" role="alert" aria-live="polite"></div>

        <!-- الجدول -->
        <div class="table-responsive items-table-wrapper">

          <table class="table table-bordered  align-middle mb-0 table-striped">
            <colgroup>
              <col style="width: 14%">
              <col style="width: 38%">
              <col style="width: 38%">
              <col style="width: 10%">
          </colgroup>

            <thead class="table-dark">
              <tr>
                <th>اسم الصنف</th>
                <th class="text-center">المخزون</th>
                <th class="text-center">سعر البيع</th>
                <th class="text-center">العمليات</th>
              </tr>
            </thead>

            <tbody id="itemsTableBody">

              <!-- حالة التحميل الأولية -->
              <tr>
                <td colspan="4">
                  <div class="table-state">
                    <span class="spinner-border spinner-border-sm"></span>
                    <span>جاري تحميل الأصناف...</span>
                  </div>
                </td>
              </tr>

            </tbody>

          </table>

        </div>

        <!-- ترقيم الصفحات -->
        <div class="table-pagination">

          <div class="pagination-info" id="paginationInfo">
            الصفحة 1
          </div>

          <nav aria-label="ترقيم صفحات الأصناف">
            <ul class="pagination mb-0" id="paginationList">
            </ul>
          </nav>

        </div>

      </section>

    </main>


    <div class="modal fade" id="deleteItemModal" tabindex="-1" aria-labelledby="deleteItemModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content delete-modal-content">

          <div class="modal-body text-center p-4">

            <div class="delete-modal-icon">
              <i class="fa-solid fa-trash-can"></i>
            </div>

            <h5 id="deleteItemModalLabel">حذف الصنف</h5>

            <p class="delete-confirm-text">
              هل أنت متأكد من حذف الصنف
              <strong id="deleteItemName"></strong>؟
            </p>

            <p class="delete-warning-text">
              لا يمكن التراجع عن هذه العملية.
            </p>

            <div class="delete-modal-actions">

              <button type="button" class="btn btn-light" data-bs-dismiss="modal" id="cancelDeleteBtn">
                إلغاء
              </button>

              <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                <i class="fa-solid fa-trash-can"></i>
                تأكيد الحذف
              </button>

            </div>

          </div>

        </div>

      </div>
    </div>







    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>




    <script type="module" src="../../../public/js/admin/product/new-home.js"></script>
  </body>

</html>
