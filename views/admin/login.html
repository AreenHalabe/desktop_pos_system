<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Corner</title>


    <!-- Bootstrap 5.3.2 RTL -->
    <link href="../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../public/style/admin/login.css" />
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container py-4">
        <div class="card p-4 shadow-md login-card mx-auto">
            <h1 class="text-center mb-4">لوحة التحكم</h1>

            <form id="login-form" method="POST" class="d-flex flex-column" dir="ltr">
                <!-- <input name="name"
                 class="form-control mb-3"
                  placeholder="اسم المستخدم" required >
                <input name="password" type="password" class="form-control mb-3" placeholder="كلمة المرور" required> -->


                <input type="text" name="name" class="form-control mb-3" placeholder="اسم المستخدم"
                    autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />

                <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور"
                    autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"
                    required />

                <button id="login-btn" class="btn btn-primary mt-2 mx-auto">
                    تسجيل الدخول
                </button>
            </form>

            <div id="error_list" class="alert alert-danger p-2 mt-3" style="display:none;">
                <div id="errors" class="mb-0 ps-3 text-danger"></div>
            </div>
        </div>
    </div>


 


    <script src="../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../wroot/assets/bootbox/bootbox.min.js"></script>
  
    <script type="module" src="../public/js/admin/login.js"></script>
</body>

</html>
