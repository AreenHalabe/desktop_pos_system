<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Halabi_Services.ps</title>

    <!-- Bootstrap 5.3.2 RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/account.css" />
</head>

<body>
    <site-header></site-header>
    <div class="page-container">

        <div class="customer-header">

            <div class="avatar">A</div>

            <div class="customer-info flex-grow-1">
                <h4 id="customerName"></h4>
                <small>رقم الزبون: #1024</small>
            </div>

            <div>
                <span class="badge bg-danger fs-6" id="customerStatus">مدين</span>
            </div>

        </div>

        <div class="table-container">
            <div class="card border-0 table-card p-1 d-none" id="error-card">
                <h6 class="text-danger error-box">
                    <i class="fas fa-exclamation-triangle text-danger ms-2"></i>
                    <span id="error-message">
                            حدث خطأ أثناء تحميل البيانات
                    </span>
                </h6>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="header-table">الديون المستحقة</h5>

                <div class="debt-summary">
                    <div class="label">إجمالي الديون</div>
                    <div class="value" id="totalDepts">0 ₪</div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle invoice-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>القيمة</th>
                            <th>المتبقي</th>
                            <th>التاريخ</th>
                            <th>الوقت</th>
                            <th>الحالة</th>
                            <th class="text-center">العمليات</th>
                        </tr>
                    </thead>

                    <tbody id="debtsTableBody">
                        
                        <tr id="loading-row">
                            <td colspan="100%" class="text-center py-5">
                                <div class="d-flex flex-column align-items-center gap-2">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <span class="text-muted">جاري التحميل ...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            

        </div>

    </div>

    <div id="overlay_loader"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center d-none"
        style="background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 9999;">

        <div class="text-center text-white">

            <div class="spinner-border mb-3"
                role="status"
                style="width: 4rem; height: 4rem;">
            </div>

            <p class="fs-5 mb-0">
                جاري معالجة الطلب، يرجى الانتظار...
            </p>

        </div>
    </div>


    <div class="modal fade" id="orderDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-receipt ms-2"></i>
                       
                            <span class="invoice-label">فاتورة رقم : </span>
                            <span class="badge rounded-pill bg-secondary px-3 py-2 fs-6" id="invoiceNum"></span>
                        
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- جدول الأصناف -->
                     
                    <h6 class="mb-3">
                        <i class="fas fa-list ms-2"></i>
                        الأصناف المرتبطة
                    </h6>
                        
                    
                    
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>الصنف</th>
                                    <th>الكمية</th>
                                    <th>سعر الشراء</th>
                                    <th>المجموع</th>
                                </tr>
                            </thead>
                            <tbody id="modalItemsTable">
                                <!-- سيتم ملؤه بالجافاسكريبت -->
                            </tbody>
                        </table>
                    </div>
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>
     <!-- Bootstrap JS -->
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/admin/supplier/account.js"></script>
</body>
</html>
