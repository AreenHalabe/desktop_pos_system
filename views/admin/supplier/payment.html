<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Halabi_Technology.ps</title>

    <!-- Bootstrap 5.3.2 RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/account.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/payment.css" />

  
</head>

<body>
    <site-header></site-header>
    <div class="page-container">

        <div class="customer-header">

            <div class="avatar" id="avatar">A</div>

            <div class="customer-info flex-grow-1">
                <h4 id="customerName"></h4>

                <small>
                    <span>رقم المورد : </span>
                    <span id="supplierPhone">1024#</span>
                </small>

            </div>

            <div>
                <span class="badge bg-success d-none" id="customerStatus">الحساب مسدد</span>

                <button class="btn add-btn ms-auto btn-outline-primary d-none" id="paymentBtn" data-bs-toggle="modal"
                    data-bs-target="#paymentModal
                ">
                    <i class="fas fa-money-bill-transfer ms-2"></i>
                    تسديد دفعة
                </button>

            </div>

        </div>

        <div class="table-container">
            <div class="card border-0 table-card p-1 d-none" id="error-card">
                <h6 class="text-danger error-box">
                    <i class="fas fa-exclamation-triangle text-danger ms-2"></i>
                    <span id="error-message">
                        حدث خطأ أثناء تحميل البيانات
                    </span>
                </h6>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3 supplier-header">


                <h5 class="header-table mb-0" style="font-family: Arial, sans-serif;">
                    <i class="fas fa-money-bill-wave ms-1 payment-icone"></i>
                    فواتير الدفعات
                </h5>


                <nav href="#" class="supplier-nav shadow">
                    <a href="#" class="supplier-nav-link invoice-page-btn">
                        <i class="fas fa-file-invoice ms-1"></i>
                        المشتريات
                    </a>

                    <a href="#" class="supplier-nav-link payment-active">
                        <i class="fas fa-money-bill-wave ms-1"></i>
                        الدفعات
                    </a>
                </nav>

                <div class="debt-summary">
                    <div class="label mx-auto fw-bold">إجمالي الرصيد</div>
                    <div class="value mx-auto" id="totalDepts">0 ₪</div>
                    <div>
                        <button class="btn btn-primary flex-fill print-invoice-btn">
                            <i class="fas fa-print"></i> طباعة الدُفعات
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-payment">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>قيمة الدُفعة</th>
                            <th>طريقة الدفع</th>
                            <th>تاريخ الدفع</th>
                            <th>الوقت</th>
                            <th>العمليات</th>
                        </tr>
                    </thead>

                    <tbody id="paymentsTableBody">

                        <tr id="loading-row">
                            <td colspan="100%" class="text-center py-5">
                                <div class="d-flex flex-column align-items-center gap-2">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <span class="text-muted">جاري التحميل ...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="paymentPagination"></div>
            </div>


        </div>

    </div>

    <div id="overlay_loader"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center d-none"
        style="background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 9999;">

        <div class="text-center text-white">

            <div class="spinner-border mb-3" role="status" style="width: 4rem; height: 4rem;">
            </div>

            <p class="fs-5 mb-0">
                جاري معالجة الطلب، يرجى الانتظار...
            </p>

        </div>
    </div>


    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-money-bill-transfer ms-2"></i>
                        تسديد دفعة للمورد
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="إغلاق"></button>
                </div>

                <div class="modal-body">

                    <!-- الرصيد المستحق -->
                    <div class="payment-balance">
                        <span class="fw-bold">الرصيد المستحق</span>
                        <strong id="balanceInModal">1,250.00 ₪</strong>
                    </div>

                    <form id="paymentForm">

                        

                        <!-- طريقة الدفع -->
                        <div class="mb-3">
                            <label for="paymentMethod" class="form-label">
                                طريقة الدفع *
                            </label>

                            <select id="paymentMethod" name="paymentMethode" class="form-select" required>

                                <option value="" selected disabled>
                                    اختر طريقة الدفع
                                </option>

                                <option value="نقدا">نقداً</option>
                                <option value="شيك">شيك</option>
                                <option value="حوالة بنكية">حوالة بنكية</option>
                            </select>
                        </div>

                        <!-- بيانات الشيك -->
                        <div id="checkFields" class="check-fields d-none">

                            <div class="check-fields-title">
                                <i class="fas fa-money-check-dollar ms-2"></i>
                                بيانات الشيك
                            </div>

                            <div class="row">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="checkAccountName" class="form-label">
                                            اسم الحساب المُصدر للشيك *
                                        </label>

                                        <select id="checkAccountName" name="checkAccountName" class="form-select">
                                            <option value="" selected disabled>
                                                إختر الحساب 
                                            </option>

                                            <option value="حسني">
                                                حسني
                                            </option>

                                            <option value="وسيم">
                                                وسيم
                                            </option>

                                            <option value="أخرى">
                                                أٌخرى
                                            </option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="currency" class="form-label">
                                        عملة الشيك *
                                        </label>

                                        <select id="currency" name="currency" class="form-select">
                                            <option value="" selected disabled>
                                                اختر العملة
                                            </option>

                                            <option value="ILS">شيكل</option>
                                            <option value="USD">دولار</option>
                                            <option value="JOD">دينار</option>
                                            <option value="EUR">يورو</option>
                                        </select>
                                    </div>


                                    <div id="foreignCurrencyFields" class="row d-none">

                                        <div class="col-md-6 mb-3">
                                            <label for="checkAmount" class="form-label">
                                               قيمة الشيك بالعملة المختارة *
                                            </label>

                                            <input
                                                type="number"
                                                id="checkAmount"
                                                name="checkAmount"
                                                class="form-control"
                                                step="0.01"
                                                min="0"
                                                placeholder="أدخل قيمة الدفعة"
                                            >
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="exchangeRate" class="form-label">
                                                سعر صرف العملة مقابل الشيكل *
                                            </label>

                                            <input
                                                type="number"
                                                id="exchangeRate"
                                                name="exchangeRate"
                                                class="form-control"
                                                step="0.0001"
                                                min="0"
                                                placeholder="أدخل سعر الصرف"
                                            >
                                        </div>

                                    </div>
                                </div>
                                <hr>
                                
                                <!-- رقم الشيك -->
                                <div class="col-md-6 mb-3">
                                    <label for="checkNumber" class="form-label">
                                        رقم الشيك *
                                    </label>

                                    <input type="text" id="checkNumber" name="checkNumber" class="form-control"
                                        placeholder="أدخل رقم الشيك">
                                </div>

                                <!-- اسم البنك -->
                                <div class="col-md-6 mb-3">
                                    <label for="bankName" class="form-label">
                                        اسم البنك *
                                    </label>

                                    <input type="text" id="bankName" name="bankName" class="form-control"
                                        placeholder="أدخل اسم البنك">
                                </div>


                                <!-- تاريخ الاستحقاق -->
                                <div class="col-md-6 mb-3">
                                    <label for="dueDate" class="form-label">
                                        تاريخ الاستحقاق *
                                    </label>

                                    <input type="date" id="dueDate" name="dueDate" class="form-control">
                                </div>

                                <!-- الملاحظات -->
                                <div class="col-12 mb-2">
                                    <label for="notes" class="form-label">
                                        ملاحظات
                                    </label>

                                    <textarea id="notes" name="notes" class="form-control" rows="3"
                                        placeholder="أدخل أي ملاحظات عن الشيك..."></textarea>
                                </div>

                            </div>
                        </div>

                        <!-- المبلغ -->
                        <div class="mb-3" id="paymentDiv">
                            <label for="paymentAmount" class="form-label">
                                قيمة الدفع *
                            </label>

                            <div class="input-group">
                                <input type="number" name="amount" id="paymentAmount" class="form-control" min="0"
                                    step="0.01" placeholder="أدخل قيمة الدفعة">

                                <span class="input-group-text fw-bold">₪</span>
                            </div>
                        </div>


                        

                    </form>

                    <div id="error_list" class="alert alert-danger p-2 mt-3" style="display: none;">

                        <ul id="errors" class="mb-0 ps-3 text-danger"></ul>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        إلغاء
                    </button>

                    <button type="submit" form="paymentForm" class="pay-modal-btn">

                        <i class="fas fa-check ms-1"></i>
                        تسديد الدفعة
                    </button>

                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/admin/supplier/payment.js"></script>
</body>

</html>
