<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Halabi_Services.ps</title>

    <!-- Bootstrap 5.3.2 RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/account.css" />

    <style>
        #paymentModal .modal-header {
            background: #123f50;
            color: #fff;
        }

        #paymentModal .modal-title {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            font-weight: 600;
        }

        #paymentModal .form-label {
            font-size: 1rem;
            font-weight: 600;
        }

        #paymentModal .form-control,
        #paymentModal .form-select {
            min-height: 44px;
            font-size: 1rem;
        }

        #paymentModal .input-group-text {
            font-weight: 600;
            background: #f1f3f5;
        }

        .pay-modal-btn {
            border: none;
            border-radius: 0.4rem;
            padding: 0.55rem 1rem;

            background: #123f50;
            color: #fff;

            font-size: clamp(0.95rem, 1.4vw, 1.1rem);
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .pay-modal-btn:hover {
            background: #0e3442;
        }

        .pay-modal-btn:active {
            transform: scale(0.97);
        }

        .payment-balance {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;

            background: #eef4f6;
            border-radius: 0.5rem;

            font-size: 1rem;
        }

        .payment-balance strong {
            color: #123f50;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <site-header></site-header>
    <div class="page-container">

        <div class="customer-header">

            <div class="avatar" id="avatar">A</div>

            <div class="customer-info flex-grow-1">
                <h4 id="customerName"></h4>

                <small>
                    <span>رقم الزبون : </span>
                    <span id="supplierPhone">1024#</span>
                </small>

            </div>

            <div>
                <span class="badge bg-success d-none" id="customerStatus">الحساب مسدد</span>

                <button class="btn add-btn ms-auto btn-outline-primary d-none" id="paymentBtn" data-bs-toggle="modal"
                    data-bs-target="#paymentModal
                ">
                    <i class="fas fa-money-bill-transfer ms-2"></i>
                    تسديد دفعة
                </button>

            </div>

        </div>

        <div class="table-container">
            <div class="card border-0 table-card p-1 d-none" id="error-card">
                <h6 class="text-danger error-box">
                    <i class="fas fa-exclamation-triangle text-danger ms-2"></i>
                    <span id="error-message">
                        حدث خطأ أثناء تحميل البيانات
                    </span>
                </h6>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">


                <h5 class="header-table mb-0">
                    <i class="fas fa-money-bill-wave ms-1 payment-icone"></i>
                    فواتير الدفعات
                </h5>


                <nav href="#" class="supplier-nav shadow">
                    <a href="#" class="supplier-nav-link invoice-page-btn">
                        <i class="fas fa-file-invoice ms-1"></i>
                        المشتريات
                    </a>

                    <a href="#" class="supplier-nav-link payment-active">
                        <i class="fas fa-money-bill-wave ms-1"></i>
                        الدفعات
                    </a>
                </nav>

                <div class="debt-summary">
                    <div class="label mx-auto">إجمالي الرصيد</div>
                    <div class="value mx-auto" id="totalDepts">0 ₪</div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-payment">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>القيمة</th>
                            <th>طريقة الدفع</th>
                            <th>تاريخ الدفع</th>
                            <th>الوقت</th>
                            <th class="text-center">العمليات</th>
                        </tr>
                    </thead>

                    <tbody id="debtsTableBody">

                        <tr id="loading-row">
                            <td colspan="100%" class="text-center py-5">
                                <div class="d-flex flex-column align-items-center gap-2">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <span class="text-muted">جاري التحميل ...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>


        </div>

    </div>

    <div id="overlay_loader"
        class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center d-none"
        style="background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 9999;">

        <div class="text-center text-white">

            <div class="spinner-border mb-3" role="status" style="width: 4rem; height: 4rem;">
            </div>

            <p class="fs-5 mb-0">
                جاري معالجة الطلب، يرجى الانتظار...
            </p>

        </div>
    </div>


    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-money-bill-transfer ms-2"></i>
                        تسديد دفعة للمورد
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="إغلاق"></button>
                </div>

                <div class="modal-body">

                    <!-- الرصيد المستحق -->
                    <div class="payment-balance">
                        <span class="fw-bold">الرصيد المستحق</span>
                        <strong id="balanceInModal">1,250.00 ₪</strong>
                    </div>

                    <form id="paymentForm">

                        <!-- المبلغ -->
                        <div class="mb-3">
                            <label for="paymentAmount" class="form-label fw-bold">
                               قيمة الدفع *
                            </label>

                            <div class="input-group">
                                <input type="number" name="amount" id="paymentAmount" class="form-control" min="0" step="0.01"
                                    placeholder="أدخل قيمة الدفعة" required>
                                <span class="input-group-text fw-bold ">₪</span>
                            </div>
                        </div>

                        <!-- طريقة الدفع -->
                        <div class="mb-3">
                            <label for="paymentMethod" class="form-label fw-bold">
                                طريقة الدفع *
                            </label>

                            <select id="paymentMethod" name="paymentMethode" class="form-select" required>
                                <option value="" selected disabled>
                                    اختر طريقة الدفع
                                </option>
                                <option value="نقدا">نقداً</option>
                                <option value="شيك">شيك</option>
                                <option value="حوالة بنكية">حوالة بنكية</option>
                            </select>
                        </div>

                    </form>

                    <div id="error_list" class="alert alert-danger p-2 mt-3" style="display: none;">
                        <ul id="errors" class="mb-0 ps-3 text-danger"></ul>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        إلغاء
                    </button>

                    <button type="submit" form="paymentForm" class="pay-modal-btn">
                        <i class="fas fa-check ms-1"></i>
                        تسديد الدفعة
                    </button>

                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/admin/supplier/payment.js"></script>
</body>

</html>
