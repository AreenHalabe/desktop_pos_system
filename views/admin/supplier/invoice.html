<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halabi_Technology.ps</title>

    <!-- Bootstrap RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/invoice.css" />
</head>

<body>
    <site-header></site-header>
    <div class="container-fluid py-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="mb-1">
                    <i class="fa-solid fa-file-invoice text-primary"></i>
                    إنشاء فاتورة شراء
                </h3>

                <p class="text-muted mb-0 ms-3">
                    إضافة طلبية جديدة من المورد
                </p>
            </div>
        </div>




        <!-- Products -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-primary text-white">

                <i class="fa-solid fa-boxes-stacked"></i>

                إضافة الأصناف

            </div>


            <div class="card-body">

                <!-- Filters -->

                <div class="row g-3 mb-3">

                    <!-- Search -->

                    <div class="col-lg-5">

                        <label class="form-label">
                            البحث عن صنف
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>

                            <input type="text" id="searchInput" class="form-control"
                                placeholder="اسم الصنف أو الباركود...">

                        </div>

                    </div>


                    <!-- Main Category -->

                    <div class="col-lg-3">

                        <label class="form-label">
                            التصنيف الرئيسي
                        </label>

                        <select id="mainCategorySelect" class="form-select">

                            <option value="">كل التصنيفات</option>
                            <option value="" disabled id="loadingMainCategory">جاري التحميل...</option>
                        </select>

                    </div>


                    <!-- Sub Category -->

                    <div class="col-lg-3">

                        <label class="form-label">
                            التصنيف الفرعي
                        </label>

                        <select id="subCategorySelect" class="form-select">

                            <option value="">كل التصنيفات</option>

                            <option value="" disabled id="loadingSubCategory">جاري التحميل...</option>


                        </select>

                    </div>


                    <div class="col-lg-1 d-flex align-items-end">

                        <button id="clearFilters" class="btn btn-outline-secondary w-100" title="مسح الفلاتر">

                            <i class="fa-solid fa-filter-circle-xmark"></i>

                        </button>

                    </div>

                </div>


                <!-- Products result -->

                <div id="productsContainer" class="products-container">

                </div>


                <!-- No results -->

                <div id="noProducts" class="text-center text-muted py-4 d-none">

                    <i class="fa-solid fa-box-open fa-2x mb-2"></i>

                    <div>
                        لا توجد أصناف مطابقة للبحث
                    </div>

                </div>

            </div>
        </div>


        <!-- Invoice -->

        <div class="invoice-info card shadow-sm mb-4">

            <div class="card-header bg-light fw-bold">

                <i class="fa-solid fa-cart-shopping text-secondary"></i>
                أصناف الطلبية

                <span id="itemsCount" class="badge bg-secondary float-end">
                    0 صنف

                </span>

            </div>


            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">

                            <tr>

                                <th>#</th>

                                <th>الصنف</th>

                                <th width="200">وِحدة الشِراء</th>

                                <th width="200">
                                    سعر التكلفة
                                </th>

                                <th width="130">
                                    الكمية
                                </th>

                                <th>
                                    الإجمالي
                                </th>

                                <th width="60">
                                </th>

                            </tr>

                        </thead>

                        <tbody id="invoiceItems">

                            <tr id="emptyInvoice">

                                <td colspan="7" class="text-center text-muted py-5">

                                    <i class="fa-solid fa-cart-plus fa-2x mb-2"></i>

                                    <div>
                                        لم تتم إضافة أي أصناف للطلبية
                                    </div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


            </div>
        </div>

        <div class="row">

            <div class="w-100 invoice-summary-wrapper">

                <div class="card shadow-sm">

                    <div class="card-header bg-primary fw-bold text-white d-flex justify-content-between align-items-center">
                        <div>   
                            <i class="fa-solid fa-calculator"></i>

                             ملخص الفاتورة   
                        </div>
                        

                        <div class="d-flex gap-2">

                            <small class="fw-bold">
                                إجمالي الأصناف :
                            </small>

                            <strong>
                                <span id="subtotal">0.00</span>
                                <span>₪</span>
                            </strong>

                        </div>

                    </div>

                    <div class="card-body">

                        <div class="d-flex justify-content-between mb-3">

                            <div class="col-md-5">

                                <label class="form-label fw-bold">
                                    المورد
                                </label>

                                <select id="supplierSelect" class="form-select">
                                    <option value="">-- اختر المورد --</option>
                                    <option value="1">شركة الأمل</option>
                                    <option value="2">شركة القدس للمواد الغذائية</option>
                                    <option value="3">مؤسسة الخير</option>
                                    <option value="4">شركة البركة</option>

                                </select>

                            </div>

                            <!-- <div class="d-flex gap-2 mb-3">

                                <small class="fw-bold">
                                    إجمالي الأصناف :
                                </small>

                                <strong>
                                    <span id="subtotal">0.00</span>
                                    <span>₪</span>
                                </strong>

                            </div> -->

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                الخصم
                            </label>

                            <div class="input-group">

                                <input type="number" id="discount" class="form-control" min="0" step="0.01" value="0">

                                <span class="input-group-text">
                                    ₪
                                </span>

                            </div>

                        </div>


                        <hr>


                        <div class="d-flex justify-content-between align-items-center">

                            <span class="fs-5">
                                الإجمالي النهائي
                            </span>

                            <strong class="fs-4 text-primary">

                                <span id="totalPrice">
                                    0.00
                                </span>

                                ₪

                            </strong>

                        </div>


                        <button id="confirmOrder" class="btn btn-success btn-lg w-100 mt-4">

                            <i class="fa-solid fa-check"></i>

                            تأكيد الطلبية

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>



    <script type="module" src="../../../public/js/admin/supplier/invoice.js"></script>
</body>

</html>
