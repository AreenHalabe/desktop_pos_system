<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halabi_Services.ps</title>

  <!-- Bootstrap 5.3.2 RTL -->
  <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../../../public/style/admin/header.css" />
  <link rel="stylesheet" href="../../../public/style/admin/table/index.css" />

</head>

<body>

  <site-header></site-header>


  <div class="container py-4">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">إدارة الطاولات</h4>

      <div class="d-flex gap-2">

        <button class="btn btn-danger destroy-btn" id="deleteAllTablesBtn">
          <i class="fa fa-trash"></i> حذف الكل
        </button>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="fa fa-plus"></i> إضافة طاولة
        </button>

      </div>
    </div>

    <div id="tablesContainer" class="row g-3">
    </div>

    <div class="row mt-5" id="loaderCard">
      <div class="col-12">
        <div class="card border-0 table-card">
          <div class="card-body d-flex align-items-center justify-content-center" style="height: 100px;">
            <div class="spinner-border text-primary" role="status"> </div>
          </div>
        </div>
      </div>
    </div>

  </div>



  <button class="btn btn-primary rounded-circle floating-add" data-bs-toggle="modal" data-bs-target="#addModal">
    <i class="fa fa-plus"></i>
  </button>

  <!-- Modal -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">إضافة طاولة</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <!-- Single -->
          <div id="singleInput">
            <label class="form-label">رقم الطاولة</label>
            <input type="number" id="tableNumber" class="form-control">
          </div>

          <!-- Bulk -->
          <div id="bulkInputs" class="d-none">
            <label class="form-label">بداية الرقم</label>
            <input type="number" id="startTable" class="form-control mb-2">

            <label class="form-label">الزيادة (Step)</label>
            <input type="number" id="step" class="form-control mb-2">

            <label class="form-label">عدد الطاولات</label>
            <input type="number" id="count" class="form-control">
          </div>

          <div class="form-check mt-3 cursor-pointer">
            <input class="form-check-input" type="checkbox" id="bulkCheck">
            <label class="form-check-label" for="bulkCheck">
              إضافة أكثر من طاولة
            </label>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button class="btn btn-primary add-btn">حفظ</button>
        </div>

      </div>
    </div>
  </div>

  <div id="overlay_loader" style="
      display:none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    ">
    <div class="text-center text-white">
      <div class="spinner-border" role="status" style="width: 4rem; height: 4rem;">
      </div>
      <p class="mt-3 fs-5">جاري معالجة الطلب، يرجى الانتظار...</p>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
  <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

  <script type="module" src="../../../public/js/admin/table/index.js"></script>

</body>

</html>
