<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Corner</title>
    <!-- Bootstrap RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/admin/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/category/index.css" />
    
    
  </head>

  <body  id="content">

    <site-header></site-header>


    <!-- ================= BODY ================= -->
    <div class="container-xxl mt-4">
        <div class="row justify-content-start">
            <div class="col-md-12">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <div class="row align-items-center">
                            <div class="col col-md-6 justify-content-start">
                                <h1 >إدارة الأقسام والفئات</h1>
                            </div>
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="mb-4 d-flex gap-2 flex-wrap align-items-center button-container">
                            <button class="btn btn-primary" id="addMainCategoryBtn">
                                <i class="bi bi-folder-plus"></i> إضافة قسم رئيسي
                            </button>

                            <span
                                class="d-inline-block span-button"
                            >

                                <button class="btn btn-outline-primary" id="addCategoryBtn" 
                                    disabled
                                >
                                    <i class="bi bi-tags"></i> إضافة فئة
                                </button>
                            </span>
                        </div>

                        <div class="d-none align-items-center" id="loader-category">
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                            <span class="ms-2">جاري التحميل...</span>
                        </div>
                        <!-- Categories Tree -->
                        <div class="row g-4" id="categories-tree" >
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




 <!-- ==================================================================================== -->


    <!-- add or edit  main_category -->
    <div class="modal fade" id="mainCategoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title-one"></h5>
                </div>

                <!-- form -->
                <form id="mainCategoryForm">
                    <input type="hidden" name="id" id="mainCategory_id">

                    <div class="modal-body d-flex flex-column gap-2">
                        <label class="modal-label" for="category_name">إسم القسم</label>
                        <input type="text" name="name" id="mainCategory_name" class="form-control" placeholder="أدخل الإسم"required>
                    </div>

                    <div id="error_list" class="alert alert-danger p-2 mt-3" style="display: none;">
                        <ul id="errors" class="mb-0 ps-3 text-danger"></ul>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            إلغاء
                        </button>
                        <button id="mainCategorySubmitBtn" type="submit" class="btn btn-primary">
                            إضافة
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

 <!-- ==================================================================================== -->

    <!--add or edit category-->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title-two"></h5>
                </div>

                <!-- form -->
                <form id="categoryForm">
                    <input type="hidden" name="id" id="category_id">

                    <div class="modal-body d-flex flex-column gap-3">
                        <div class="d-flex flex-column gap-1">
                            <label class="modal-label" for="category_name">إسم الفئة</label>
                            <input type="text" id="category_name" name="name" class="form-control w-50" placeholder="أدخل إسم" required>
                        </div>
                        <div class="d-flex flex-column gap-1">
                            <label class="modal-label" for="main_category">اختر القسم الرئيسي للفئة:</label>
                            <select name="main_category_id" id="main_category" class="form-select w-50" required>
                                <option value="all" selected disabled >-- اختر القسم --</option>
                            </select>
                        </div>
                    </div>

                    <div id="error_list" class="alert alert-danger p-2 mt-3" style="display: none;">
                        <ul id="errors" class="mb-0 ps-3 text-danger"></ul>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            إلغاء
                        </button>
                        <button id="categorySubmitBtn" type="submit" class="btn btn-primary">
                            إضافة
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    

    <div id="overlay_loader"
    style="
      display:none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    ">
    <div class="text-center text-white">
      <div class="spinner-border"
          role="status"
          style="width: 4rem; height: 4rem;">
      </div>
      <p class="mt-3 fs-5">جاري معالجة الطلب، يرجى الانتظار...</p>
    </div>
    </div>

  
  
    
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/admin/category/home.js"></script>
  </body>
</html>
