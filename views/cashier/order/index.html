<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halabi_services</title>


    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../public/style/cashier/header.css" />
    <link rel="stylesheet" href="../../../public/style/cashier/order/index.css" />

</head>

<body>

    <main class="cashier-page">

        <div class="cashier-layout">

            <section class="invoice-side">

                <div class="panel invoice-panel">

                    <div class="panel-heading">


                        <div class="col-8">
                            <div class="input-group barcode-input">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-barcode fa-lg"></i>
                                </span>

                                <input type="text" class="form-control" placeholder="امسح أو أدخل الباركود..."
                                    aria-label="باركود الصنف">
                            </div>
                        </div>

                        <button class="btn btn-sm btn-outline-secondary" type="button">
                            <i class="fa-solid fa-file-circle-plus ms-1"></i>
                            فاتورة جديدة
                        </button>
                    </div>

                    <div class="invoice-table-wrap">

                        <table class="table invoice-table table-striped">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>الصنف</th>
                                    <th>الوحدة</th>
                                    <th>الكمية</th>
                                    <th>السعر</th>
                                    <th>الخصم</th>
                                    <th>الإجمالي</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <tbody>

                               

                            </tbody>
                        </table>

                    </div>



                </div>

                <!-- ملخص الدفع ضمن محتوى صفحة الكاشير -->
                <section class="panel payment-panel">

                    <div class="row g-2 align-items-center">

                        <!-- الإجمالي المطلوب -->
                        <div class="col-6 col-md-3">
                            <div class="payment-label">الإجمالي المطلوب</div>
                            <div class="total-value">0.00 ₪</div>
                        </div>

                        <!-- الخصم -->
                        <div class="col-6 col-md-4">
                            <div class="payment-box discount-box">

                                <div class="payment-label">الخصم</div>

                                <div class="discount-options">

                                    <label class="discount-option">
                                        <input type="radio" name="discountType" value="partial" checked>
                                        <span>جزئي</span>
                                    </label>

                                    <label class="discount-option">
                                        <input type="radio" name="discountType" value="full">
                                        <span>كلي</span>
                                    </label>

                                    <div class="input-group input-group-sm total-discount">
                                        <input type="number" id="totalDiscount" class="form-control" min="0" max="100"
                                            step="1" placeholder="0" aria-label="نسبة الخصم الكلي">

                                        <span class="input-group-text">%</span>
                                    </div>

                                </div>

                            </div>
                        </div>

                        <!-- الباقي -->
                        <div class="col-6 col-md-3">
                            <div class="payment-box remaining-box">

                                <div class="payment-label">الباقي</div>

                                <div class="payment-value">
                                    0.00 <small>₪</small>
                                </div>

                            </div>
                        </div>

                        <!-- زر الدفع -->
                        <div class="col-6 col-md-2">
                            <button class="btn btn-primary-custom pay-btn w-100" type="button">
                                <i class="fa-solid fa-credit-card ms-1"></i>
                                الدفع F4
                            </button>
                        </div>

                    </div>

                </section>

            </section>

            <!-- =================================
             البحث والتصنيفات - الجهة اليمنى
        ================================== -->
            <aside class="products-side">

                <section class="panel products-panel">

                    <div class="panel-heading">
                        <h2 class="panel-title">
                            <i class="fa-solid fa-layer-group ms-2 text-success"></i>
                            الوصول للأصناف
                        </h2>
                    </div>

                    <!-- التصنيف الرئيسي والفرعي -->
                    <div class="filters">

                        <div class="row g-2">

                            <div class="col-6">
                                <label for="mainCategory" class="form-label">
                                    التصنيف الرئيسي
                                </label>

                                <select id="mainCategory" class="form-select">
                                    <option selected>كل التصنيفات</option>
                                    <option disabled id="loadingMainCategory">جاري التحميل...</option>
                                </select>
                            </div>

                            <div class="col-6">
                                <label for="subCategory" class="form-label">
                                    التصنيف الفرعي
                                </label>

                                <select id="subCategory" class="form-select">
                                    <option selected>كل التصنيفات</option>
                                    <option disabled id="loadingSubCategory">جاري التحميل...</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <div class="input-group">
                                    <span class="input-group-text bg-white">
                                        <i class="fa-solid fa-magnifying-glass muted"></i>
                                    </span>

                                    <input type="search" class="form-control"
                                        placeholder="ابحث عن اسم الصنف أو رقمه...">
                                </div>
                            </div>

                        </div>

                    </div>

                    <!-- قائمة الأصناف -->
                    <div class="section-content">

                        <div class="section-title">
                            <span>الأصناف</span>
                        </div>

                        <div id="productLoader" class="d-flex justify-content-center align-items-center w-100">
                            <div class="text-center mx-auto py-5">
                                <div class="spinner-border text-primary mb-3" role="status">
                                    <span class="visually-hidden">جاري التحميل...</span>
                                </div>

                                <p class="text-muted mb-0">جاري تحميل الأصناف...</p>
                            </div>
                        </div>

                        <div class="product-list">
                            
                           
                        </div>

                        

                    </div>
                </section>

            </aside>

        </div>

    </main>


    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/cashier/order/index.js"></script>

</body>

</html>
