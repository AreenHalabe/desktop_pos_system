<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مرتجعة</title>

    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../public/style/cashier/header.css" />

    <style>
        body {
            background: #dde1e4;
            color: #263238;
        }

        .return-page {
            padding: 22px;
        }

        .page-title {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .panel {
            background: #fff;
            border: 1px solid #e7e9ed;
            border-radius: 12px;
            padding: 16px;
            height: 100%;
        }

        .panel-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
        }

        .invoice-table-wrap {
            max-height: 62vh;
            overflow: auto;
        }

        .invoice-table {
            vertical-align: middle;
            white-space: nowrap;
        }

        .invoice-table thead {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .invoice-table th,
        .invoice-table td {
            text-align: center;
            vertical-align: middle;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 9px;
            max-height: 57vh;
            overflow-y: auto;
        }

        .product-item {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background: #fff;
            padding: 12px 9px;
            text-align: right;
            min-height: 76px;
            transition: .15s;
        }

        .product-item:hover {
            border-color: #198754;
            background: #f5fbf7;
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 7px;
        }

        .product-price {
            color: #198754;
            font-size: .9rem;
        }

        .qty-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #d8dce2;
            border-radius: 6px;
            background: #fff;
            font-weight: 700;
        }

        .qty-value {
            min-width: 22px;
            font-weight: 700;
        }

        .total-card {
            background: #f1f8f3;
            border: 1px solid #d8ecde;
            border-radius: 10px;
            padding: 13px;
        }

        .total-value {
            color: #198754;
            font-size: 1.45rem;
            font-weight: 800;
        }

        

.amount-quantity-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    width: 100%;
    min-width: 115px;

    padding: 8px 12px;

    border: 1px solid #0284c7;
    border-radius: 8px;

    background: #e0f2fe;
    color: #0369a1;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
    transition: .2s;
}

.amount-quantity-btn:hover {
    background: #0284c7;
    color: white;
}










        @media (max-width: 991.98px) {
            .return-page {
                padding: 12px;
            }

            .invoice-table-wrap {
                max-height: 45vh;
            }

            .product-list {
                max-height: 42vh;
            }
        }

        #clearCartBtn {
            transition: all 0.25s ease;
        }

        #clearCartBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(220, 53, 69, 0.25);
        }

        #clearCartBtn:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(220, 53, 69, 0.2);
        }
    </style>
</head>

<body>
    <div class="header-wrapper">
        <site-header></site-header>
    </div>
    <main class="container-fluid return-page">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <h1 class="page-title mb-0"><i class="fa-solid fa-arrow-rotate-left text-success ms-2"></i>فاتورة مرتجعة
            </h1>
            <button type="button" id="clearCartBtn" class="btn btn-danger btn-sm">
                <i class="fa-regular fa-trash-can ms-1"></i>تفريغ الفاتورة
            </button>
        </div>

        <div class="row g-3">
            <aside class="col-12 col-xl-5">
                <div class="panel">
                    <div class="panel-heading">
                        <h2 class="panel-title"><i class="fa-solid fa-boxes-stacked text-success ms-2"></i>الوصول
                            للأصناف</h2>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="mainCategory" class="form-label">التصنيف الرئيسي</label>
                            <select id="mainCategory" class="form-select">
                                <option value="">كل التصنيفات</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="subCategory" class="form-label">التصنيف الفرعي</label>
                            <select id="subCategory" class="form-select">
                                <option value="">كل التصنيفات</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i
                                        class="fa-solid fa-magnifying-glass"></i></span>
                                <input id="productSearch" type="search" class="form-control"
                                    placeholder="ابحث باسم الصنف أو رقمه أو الباركود...">
                            </div>
                        </div>
                    </div>

                    <div id="productLoader" class="text-center text-muted py-5">
                        <div class="spinner-border spinner-border-sm text-success mb-2" role="status"></div>
                        <div>جاري تحميل الأصناف...</div>
                    </div>
                    <div id="productList" class="product-list"></div>
                </div>
            </aside>


            <section class="col-12 col-xl-7">
                <div class="panel">
                    <div class="panel-heading">
                        <h2 class="panel-title">الأصناف المرتجعة</h2>
                        <div class="input-group barcode-input" style="max-width: 390px">
                            <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                            <input id="barcodeInput" type="text" class="form-control"
                                placeholder="امسح أو أدخل الباركود..." aria-label="باركود الصنف">
                        </div>
                    </div>

                    <div class="invoice-table-wrap">
                        <table class="table table-striped table-hover invoice-table mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>الصنف</th>
                                    <th>الوحدة</th>
                                    <th>الكمية</th>
                                    <th>سعر الوحدة</th>
                                    <th>الإجمالي</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="invoiceBody">
                                <tr>
                                    <td colspan="7" class="text-muted py-4">لم تتم إضافة أصناف بعد</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3">
                        <div class="total-card">
                            <div class="text-muted small">إجمالي المرتجعات</div>
                            <div id="totalValue" class="total-value">0.00 ₪</div>
                        </div>
                        <button type="button" id="submitReturnBtn" class="btn btn-success px-4">
                            <i class="fa-solid fa-paper-plane ms-1"></i>إرسال الفاتورة المرتجعة
                        </button>
                    </div>
                </div>
            </section>


        </div>
    </main>

       <div class="modal fade" id="amountQuantityModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-coins"></i>
                        تحديد الكمية حسب المبلغ
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">الصنف</label>
                        <input type="text" id="amountItemName" class="form-control fs-6" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            المبلغ المطلوب (شيكل)
                        </label>
                        <input type="number" id="amountInput" class="form-control fs-6" min="1" step="1"
                            placeholder="أدخل المبلغ">
                    </div>

                    <div class="amount-result">
                        <div class="text-muted">الكمية المسحوبة</div>
                        <h3 id="amountQuantityResult">0</h3>
                        <span id="amountUnitName">غرام</span>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        إلغاء
                    </button>

                    <button type="button" class="btn btn-primary" id="confirmAmountQuantity">
                        اعتماد الكمية
                    </button>
                </div>

            </div>
        </div>
    </div>

     <div id="overlay_loader" style="
                display:none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.55);
                backdrop-filter: blur(3px);
                z-index: 9999;
                justify-content: center;
                align-items: center;
            ">
        <div class="text-center text-white">
            <div class="spinner-border" role="status" style="width: 4rem; height: 4rem;">
            </div>
            <p class="mt-3 fs-5">جاري معالجة الطلب، يرجى الانتظار...</p>
        </div>
    </div>


    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/cashier/order/retur-inv.js"></script>
</body>

</html>
