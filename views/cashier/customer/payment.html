<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Halabi_Technology.ps</title>

    <!-- Bootstrap 5.3.2 RTL -->
    <link href="../../../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="../../../wroot/assets/bootstrap/css/bootstrap-icons.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="../../../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../../public/style/cashier/header.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/account.css" />
    <link rel="stylesheet" href="../../../public/style/admin/supplier/payment.css" />

  
</head>

<body>
    <site-header></site-header>
    <div class="page-container">

        <div class="customer-header">

            <div class="avatar bg-success" id="avatar">A</div>

            <div class="customer-info flex-grow-1">
                <h4 id="customerName"></h4>

                <small>
                    <span>رقم العميل : </span>
                    <span id="supplierPhone">1024#</span>
                </small>

            </div>

            <div>
                <span class="badge bg-success d-none" id="customerStatus">الحساب مسدد</span>
            </div>

        </div>

        <div class="table-container">
            <div class="card border-0 table-card p-1 d-none" id="error-card">
                <h6 class="text-danger error-box">
                    <i class="fas fa-exclamation-triangle text-danger ms-2"></i>
                    <span id="error-message">
                        حدث خطأ أثناء تحميل البيانات
                    </span>
                </h6>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3 supplier-header">


                <h5 class="header-table mb-0" style="font-family: Arial, sans-serif;">
                    <i class="fas fa-money-bill-wave ms-1 payment-icone"></i>
                    فواتير الدفعات
                </h5>


                <nav href="#" class="supplier-nav shadow">
                    <a href="#" class="supplier-nav-link invoice-page-btn">
                        <i class="fas fa-file-invoice ms-1"></i>
                        المشتريات
                    </a>

                    <a href="#" class="supplier-nav-link payment-active">
                        <i class="fas fa-money-bill-wave ms-1"></i>
                        الدفعات
                    </a>
                </nav>

                <div class="debt-summary">
                    <div class="label mx-auto fw-bold">إجمالي الرصيد</div>
                    <div class="value mx-auto" id="totalDepts">0 ₪</div>
                    <div class="d-none">
                        <button class="btn btn-primary flex-fill print-invoice-btn">
                            <i class="fas fa-print"></i> طباعة الدُفعات
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-payment">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>قيمة الدُفعة</th>
                            <th>ملاحظة</th>
                            <th>تاريخ الدفع</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>

                    <tbody id="paymentsTableBody">

                        <tr id="loading-row">
                            <td colspan="100%" class="text-center py-5">
                                <div class="d-flex flex-column align-items-center gap-2">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <span class="text-muted">جاري التحميل ...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div id="paymentPagination"></div>
            </div>


        </div>

    </div>

  




    <!-- Bootstrap JS -->
    <script src="../../../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../../../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../../../wroot/assets/bootbox/bootbox.min.js"></script>

    <script type="module" src="../../../public/js/cashier/customer/payment.js"></script>
</body>

</html>
