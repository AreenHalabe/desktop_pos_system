<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halabi_Services.ps</title>

    <link href="../wroot/assets/bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="../wroot/assets/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/style/admin/login.css" />
</head>

<body>
    <div class="login-container">

        <div class="card login-card shadow">

            <div class="text-center mb-4">

                <div class="logo">
                    <i class="fas fa-user-shield"></i>
                </div>

                <h2 class="mt-3 mb-1"> إدارة المطعم</h2>

                <p class="text-muted">
                    الرجاء تسجيل الدخول للمتابعة
                </p>

            </div>

            <form id="login-form" method="POST">

                <div class="input-group mb-3">

                    

                    <input type="text" name="name" class="form-control" placeholder="اسم المستخدم"
                        autocomplete="username" required>

                    <span class="input-group-text">
                        <i class="fas fa-user"></i>
                    </span>

                </div>


                <div class="password-wrapper">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    <div class="input-group mb-4">
                        <input type="password" name="password" class="form-control" id="password"
                            placeholder="كلمة المرور" autocomplete="current-password" required>


                            
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                    </div>
                </div>

                <button id="login-btn" class="btn btn-primary w-100">
                    <i class="fas fa-right-to-bracket"></i>
                    تسجيل الدخول
                </button>

            </form>

            <div id="error_list" class="alert alert-danger text-danger fw-bold mt-3" style="display:none;">
                <div id="errors"></div>
            </div>

        </div>

    </div>


    <!-- المودال -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0 rounded-4">

                <!-- Header -->
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-user-lock text-primary ms-2"></i>
                        تسجيل الدخول
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Body -->
                <div class="modal-body text-center">

                    <p class="text-muted mb-4">اختر نوع الدخول</p>

                    <div class="d-flex gap-3 justify-content-center">

                        <!-- Admin -->
                        <button class="btn btn-outline-primary w-100 py-3 role-btn" data-role="admin">
                            <i class="fas fa-user-shield fa-2x mb-2"></i>
                            <div class="fw-bold">أدمن</div>
                        </button>

                        <!-- Cashier -->
                        <button class="btn btn-outline-success w-100 py-3 role-btn" data-role="cashier">
                            <i class="fas fa-cash-register fa-2x mb-2"></i>
                            <div class="fw-bold">كاشير</div>
                        </button>

                    </div>

                </div>

            </div>
        </div>
    </div>



    <script src="../wroot/assets/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../wroot/assets/jquery/jquery-3.7.1.min.js"></script>
    <script src="../wroot/assets/bootbox/bootbox.min.js"></script>




    <script type="module" src="../public/js/admin/login.js"></script>
</body>

</html>
